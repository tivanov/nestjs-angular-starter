@if (!this.dataLoaded()) {
<div class="overlay">
  <app-spinner class="absolute"></app-spinner>
</div>
}
<div
  class="flex w-full h-full justify-center items-center overflow-hidden text-white">
  <form
    class="bg-[var(--mat-sys-surface-container)] p-8 rounded-lg flex flex-col w-96 border border-[color:var(--mat-sys-outline-variant)]"
    [formGroup]="form">
    <div class="font-bold text-xl w-full text-center">Your Project Name</div>
    <div class="text-base w-full text-center">Control Center</div>
    <div class="text-red-500 w-full text-center py-4">
      {{ errorMessage() }}
    </div>
    <mat-form-field class="mt-4">
      <mat-label>Username</mat-label>
      <input matInput formControlName="userName" class="w-full" />
    </mat-form-field>

    <mat-form-field class="mb-4">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        formControlName="password"
        class="w-full" />
    </mat-form-field>

    <button
      matButton="filled"
      color="primary"
      [disabled]="!form.valid"
      (click)="onSubmit()"
      >
      Login
    </button>
  </form>
</div>
